name: Publish v2.2.5 (one-off)

# One-off pre-release publish for v2.2.5 Cut from this branch.
# Builds the .mpp on a CI runner (JDK + full network), regenerates the patch
# list / README, commits the metadata back to this branch, tags v2.2.5 and
# creates the pre-release with the bundle attached. Not used by the normal
# release pipeline (release.yml).
on:
  push:
    branches:
      - arena/4877b858-proteus-patches

jobs:
  publish:
    name: Build and publish v2.2.5 pre-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run patch tests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :patches:testPermissionRemoval :patches:testBravePrivacy

      - name: Build patch list and bundle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew generatePatchesList buildAndroid

      - name: Normalize patch-list version
        run: |
          jq '.version="2.2.5"' patches-list.json > patches-list.json.tmp
          mv patches-list.json.tmp patches-list.json

      - name: Regenerate README patches section
        run: python3 .github/scripts/generate_patches_readme.py ineednotitle/Proteus-Patches arena/4877b858-proteus-patches patches-list.json README.md

      - name: Verify patch source metadata
        run: python3 .github/scripts/verify_patch_source.py patches-bundle.json 2.2.5 --normalize

      - name: Verify Android bundle
        run: python3 .github/scripts/verify_android_bundle.py patches/build/libs/patches-2.2.5.mpp 2.2.5 --patch-list patches-list.json

      - name: Commit regenerated metadata
        run: |
          git config user.name "ineednotitle"
          git config user.email "100122698+ineednotitle@users.noreply.github.com"
          git add patches-list.json README.md
          if git diff --cached --quiet; then
            echo "metadata already up to date"
          else
            git commit -m "chore: Release v2.2.5 [skip ci]"
            git push origin HEAD:arena/4877b858-proteus-patches
          fi

      - name: Create v2.2.5 pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s\n' \
            'Proteus Patches v2.2.5 (pre-release)' \
            '' \
            'New in this pre-release:' \
            '' \
            '- Reddit: new "Show deleted comments" patch (experimental). Shows the original' \
            '  text of comments deleted by their author or removed by a moderator, restored' \
            '  at render time from the free Arctic Shift public archive (no API key; falls' \
            '  back to PullPush). Restored text is prefixed with [archived]. Only the ids' \
            '  of deleted comments in the threads you open are sent, nothing else. Comments' \
            '  the archive never captured stay [deleted]. Off by default. The bytecode side' \
            '  rides the already-verified 2026.42.0 Listing.children anchor; the runtime' \
            '  restore path has not been exercised on-device yet and fails safe to the' \
            '  stock [deleted] placeholder. See docs/REDDIT-DELETED-COMMENTS.md.' \
            '' \
            'Included from v2.2.4:' \
            '' \
            '- Eight default-off Brave patches (experimental, Brave 1.98.63, not verified' \
            '  against the real APK). See docs/BRAVE.md for the full limitations list.' \
            '' \
            'Verification:' \
            '' \
            '- CI: patch tests pass; bundle builds from this branch; Android DEX bundle' \
            '  integrity verified (verify_android_bundle.py); patch-list metadata verified' \
            '  (verify_patch_source.py); patches-list.json regenerated for this bundle.' \
            '' \
            'Known limitations:' \
            '' \
            '- The Reddit restore path is static-verified only; enable it only if you are' \
            '  comfortable with archive lookups of deleted-comment ids and with the' \
            '  experimental status.' \
            '- Brave patches remain experimental and default-off, as in v2.2.4.' \
            '' \
            'For automatic updates, add the GitHub repository as a remote source in Morphe' \
            'rather than importing a local .mpp file.' \
            > /tmp/notes.md
          gh release create v2.2.5 \
            --prerelease \
            --target arena/4877b858-proteus-patches \
            --title "Proteus Patches v2.2.5" \
            --notes-file /tmp/notes.md \
            patches/build/libs/patches-2.2.5.mpp
